services:
  postgres:
    image: postgres:17
    container_name: forgetrace-db
    environment:
      POSTGRES_DB: forgetrace
      POSTGRES_USER: forgetrace
      POSTGRES_PASSWORD: ${DB_PASSWORD:-forgetrace_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgetrace -d forgetrace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: