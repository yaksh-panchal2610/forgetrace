# ===== Production (AWS) - every value comes from environment variables =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.thymeleaf.cache=true
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.com.forgetrace=INFO

# Files are saved in AWS S3
app.storage.mode=s3
app.storage.bucket=${S3_BUCKET}
app.storage.region=${AWS_REGION:ap-south-1}

# App runs behind Nginx (HTTPS)
server.forward-headers-strategy=native


# ===== Step 3: login & seeded accounts (values come ONLY from the server environment) =====
app.base-url=${APP_BASE_URL}
app.mail.log-links=false
app.admin.name=Platform Admin
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.inspector.name=Quality Inspector
app.inspector.email=${INSPECTOR_EMAIL:}
app.inspector.password=${INSPECTOR_PASSWORD:}