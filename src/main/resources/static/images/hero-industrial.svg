<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-label="Abstract illustration of machines, a production line and a QR passport">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1c2843" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="560" height="420" fill="url(#bg)"/>
  <rect width="560" height="420" fill="url(#grid)" opacity=".7"/>

  <!-- Machines -->
  <g transform="translate(40 70)">
    <rect width="130" height="110" rx="12" fill="#16213a" stroke="#243150"/>
    <rect x="16" y="16" width="98" height="46" rx="6" fill="#0b1220" stroke="#243150"/>
    <circle cx="40" cy="39" r="12" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <path d="M62 30h40M62 39h28M62 48h34" stroke="#3a4a6b" stroke-width="4" stroke-linecap="round"/>
    <rect x="16" y="76" width="44" height="18" rx="4" fill="#22d3ee" opacity=".85"/>
    <rect x="68" y="76" width="46" height="18" rx="4" fill="#243150"/>
  </g>
  <g transform="translate(200 40)">
    <rect width="150" height="140" rx="12" fill="#16213a" stroke="#243150"/>
    <rect x="18" y="18" width="114" height="70" rx="6" fill="#0b1220" stroke="#243150"/>
    <path d="M36 70l22-26 18 16 20-30 18 40" fill="none" stroke="url(#cy)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="100" width="50" height="22" rx="4" fill="#243150"/>
    <rect x="76" y="100" width="56" height="22" rx="4" fill="#f59e0b" opacity=".85"/>
  </g>

  <!-- Conveyor -->
  <g transform="translate(30 230)">
    <rect width="380" height="26" rx="13" fill="#16213a" stroke="#243150"/>
    <g fill="#3a4a6b">
      <circle cx="26" cy="13" r="6"/><circle cx="86" cy="13" r="6"/><circle cx="146" cy="13" r="6"/>
      <circle cx="206" cy="13" r="6"/><circle cx="266" cy="13" r="6"/><circle cx="326" cy="13" r="6"/>
    </g>
    <rect x="44" y="-30" width="40" height="30" rx="5" fill="#243150" stroke="#3a4a6b"/>
    <rect x="150" y="-30" width="40" height="30" rx="5" fill="#243150" stroke="#3a4a6b"/>
    <rect x="256" y="-30" width="40" height="30" rx="5" fill="#22d3ee" opacity=".9"/>
  </g>

  <!-- Inspection check -->
  <g transform="translate(60 300)">
    <rect width="250" height="80" rx="12" fill="#16213a" stroke="#243150"/>
    <circle cx="38" cy="40" r="18" fill="none" stroke="#22c55e" stroke-width="3"/>
    <path d="M29 40l7 7 13-14" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 30h150M72 46h110" stroke="#3a4a6b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- QR passport -->
  <g transform="translate(380 150)">
    <rect width="150" height="210" rx="14" fill="#16213a" stroke="#22d3ee" stroke-opacity=".5"/>
    <rect x="20" y="20" width="110" height="110" rx="8" fill="#e6ebf5"/>
    <g fill="#0b1220">
      <rect x="30" y="30" width="28" height="28"/><rect x="92" y="30" width="28" height="28"/><rect x="30" y="92" width="28" height="28"/>
      <rect x="66" y="34" width="10" height="10"/><rect x="66" y="52" width="16" height="10"/><rect x="66" y="70" width="10" height="16"/>
      <rect x="84" y="70" width="12" height="12"/><rect x="104" y="70" width="16" height="10"/><rect x="66" y="96" width="14" height="10"/>
      <rect x="88" y="92" width="10" height="16"/><rect x="104" y="96" width="16" height="16"/><rect x="84" y="112" width="10" height="8"/>
    </g>
    <path d="M20 152h110M20 170h80M20 188h96" stroke="#3a4a6b" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path d="M410 243 C 395 260, 380 262, 360 262" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 6" opacity=".7"/>
</svg>