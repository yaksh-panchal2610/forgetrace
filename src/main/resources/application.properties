# ===== Common settings (used in every environment) =====
spring.application.name=forgetrace
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database tables are created ONLY by Flyway SQL files
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Monitoring (health + metrics for the cloud demo)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Session security
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Error pages: never show stack traces to users
server.error.include-stacktrace=never
server.error.include-message=never

# ===== Step 5: files and display =====
app.display-zone=Asia/Kolkata
app.storage.max-file-size-mb=10
app.storage.allowed-extensions=pdf,png,jpg,jpeg,dxf,step,stp,csv
app.export-dir=exports

forgetrace.payment.upi-payee=forgetrace.sandbox@okbank