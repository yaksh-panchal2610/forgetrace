<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found · ForgeTrace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-card text-center">
        <div class="error-code">404</div>
        <h1 class="auth-title">Page not found</h1>
        <p class="auth-subtitle" th:text="${message} ?: 'The page you are looking for does not exist or has moved.'">
            The page you are looking for does not exist.
        </p>
        <a class="btn btn-forge px-4" th:href="@{/}">Go to home</a>
    </section>
</main>
</body>
</html>
