<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong · ForgeTrace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-card text-center">
        <div class="error-code warn">500</div>
        <h1 class="auth-title">Something went wrong</h1>
        <p class="auth-subtitle">An unexpected error happened on our side. The team has been notified in the logs. Please try again.</p>
        <a class="btn btn-forge px-4" th:href="@{/}">Go to home</a>
    </section>
</main>
</body>
</html>
