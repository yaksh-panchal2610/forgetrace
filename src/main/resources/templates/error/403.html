<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access denied · ForgeTrace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-card text-center">
        <div class="error-code warn">403</div>
        <h1 class="auth-title">Access denied</h1>
        <p class="auth-subtitle" th:text="${message} ?: 'Your account does not have permission to open this page.'">
            Your account does not have permission to open this page.
        </p>
        <div class="d-flex gap-2 justify-content-center">
            <a class="btn btn-forge px-4" th:href="@{/}">Go to home</a>
            <a class="btn btn-ghost px-4" th:href="@{/auth/login}">Switch account</a>
        </div>
    </section>
</main>
</body>
</html>
