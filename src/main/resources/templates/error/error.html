<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request could not be completed · ForgeTrace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-card text-center">
        <div class="error-code warn" th:text="${status} ?: 'Error'">409</div>
        <h1 class="auth-title">We couldn't complete that</h1>
        <p class="auth-subtitle" th:text="${message} ?: 'The request could not be completed.'">Reason</p>
        <div class="d-flex gap-2 justify-content-center">
            <a class="btn btn-ghost px-4" href="javascript:history.back()">← Go back</a>
            <a class="btn btn-forge px-4" th:href="@{/}">Home</a>
        </div>
    </section>
</main>
</body>
</html>
