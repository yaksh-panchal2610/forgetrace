<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Orders · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 class="page-title">Orders</h1>
            <p class="page-subtitle">Work confirmed by buyers. Book machine time to schedule each order.</p>
        </div>
        <a class="btn btn-ghost" th:href="@{/manufacturer/production}"><i class="bi bi-kanban me-1"></i> Production board</a>
    </div>
    <div class="d-flex flex-wrap gap-2 mb-4">
        <a class="btn btn-ghost" th:href="@{/manufacturer/batches(orderId=${order.id})}"><i class="bi bi-stack me-1"></i> Batches</a>
        <a th:if="${order.status.name() == 'READY_TO_SHIP'}" class="btn btn-forge"
           th:href="@{/manufacturer/shipments/new(orderId=${order.id})}"><i class="bi bi-truck me-1"></i> Ship order</a>
        <a class="btn btn-ghost" th:href="@{/manufacturer/shipments}"><i class="bi bi-box-arrow-right me-1"></i> Shipments</a>
    </div>

    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead>
                <tr><th>Order</th><th>Item</th><th>Buyer</th><th class="text-end">Value</th><th>Due</th><th>Status</th></tr>
                </thead>
                <tbody>
                <tr th:each="o : ${page.content}">
                    <td>
                        <a th:href="@{/manufacturer/orders/{id}(id=${o.id})}" th:text="${o.orderNumber}">ORD</a><br>
                        <small th:text="${@fmt.date(o.createdAt)}">date</small>
                    </td>
                    <td>
                        <span th:text="${o.rfqTitle}">Title</span><br>
                        <small th:text="${o.quantity.stripTrailingZeros().toPlainString() + ' ' + o.quantityUnit + ' · ' + o.processName}">100 pcs</small>
                    </td>
                    <td th:text="${o.buyerName}">Buyer</td>
                    <td class="text-end" th:text="${@fmt.money(o.totalAmount, o.currency)}">₹0</td>
                    <td th:text="${@fmt.localDate(o.expectedCompletion)}">date</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${o.status})}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-box-seam', 'No orders yet', 'Orders appear here when a buyer accepts one of your quotations.', '/manufacturer/rfqs', 'Open RFQ inbox')}"></div></th:block>
    </div>

    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/manufacturer/orders')}"></nav>
</div>
</body>
</html>
