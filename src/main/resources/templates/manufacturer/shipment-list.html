<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Shipments · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div><h1 class="page-title">Shipments</h1>
            <p class="page-subtitle">Dispatch paid orders and keep the buyer updated.</p></div>
        <a class="btn btn-forge" th:href="@{/manufacturer/shipments/new}"><i class="bi bi-plus-lg me-1"></i> New shipment</a>
    </div>
    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead><tr><th>Order</th><th>Buyer</th><th>Carrier</th><th>Dispatched</th><th>Expected</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="s : ${page.content}">
                    <td><span th:text="${s.orderNumber}">ORD</span><br><small th:text="${s.itemTitle}">Item</small></td>
                    <td th:text="${s.buyerName}">Buyer</td>
                    <td><span th:text="${s.carrierName}">Carrier</span><br><small class="text-muted-ft" th:text="${s.trackingNumber} ?: ''">AWB</small></td>
                    <td th:text="${@fmt.localDate(s.dispatchDate)}">date</td>
                    <td th:text="${s.expectedDelivery != null ? @fmt.localDate(s.expectedDelivery) : '—'}">date</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${s.status})}"></span></td>
                    <td class="text-end"><a class="btn btn-sm btn-ghost" th:href="@{/manufacturer/shipments/{id}(id=${s.id})}">Open</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-truck', 'No shipments yet', 'Ship an order once it is Ready to ship and paid.', '/manufacturer/shipments/new', 'New shipment')}"></div></th:block>
    </div>
    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/manufacturer/shipments')}"></nav>
</div>
</body>
</html>
