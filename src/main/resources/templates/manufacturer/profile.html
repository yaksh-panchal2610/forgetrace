<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Profile &amp; company · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 class="page-title">Profile &amp; company</h1>
            <p class="page-subtitle">Buyers see your company name, location, description and capabilities once you are verified.</p>
        </div>
        <span th:replace="~{fragments/status-badge :: badge(${organization.verificationStatus})}"></span>
    </div>

    <div class="row g-4">
        <!-- Personal details -->
        <div class="col-xl-4">
            <div class="ft-card">
                <h2 class="ft-card-title mb-3">Your details</h2>
                <form th:action="@{/manufacturer/profile}" th:object="${profileForm}" method="post" novalidate>
                    <div class="mb-3">
                        <label class="form-label" for="fullName">Full name</label>
                        <input type="text" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" readonly disabled>
                        <div class="form-text text-muted-ft">Email cannot be changed.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="phone">Phone</label>
                        <input type="tel" th:field="*{phone}" class="form-control" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <button type="submit" class="btn btn-forge w-100">Save details</button>
                </form>
            </div>
        </div>

        <!-- Company + capabilities -->
        <div class="col-xl-8">
            <div class="ft-card">
                <h2 class="ft-card-title mb-3">Company &amp; capabilities</h2>
                <form th:action="@{/manufacturer/profile/organization}" th:object="${orgForm}" method="post" novalidate>
                    <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                        <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="displayName">Display name</label>
                            <input type="text" th:field="*{displayName}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{displayName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="legalName">Legal name</label>
                            <input type="text" th:field="*{legalName}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{legalName}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="registrationNumber">Registration no.</label>
                            <input type="text" th:field="*{registrationNumber}" class="form-control" th:errorclass="is-invalid">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="taxId">GSTIN</label>
                            <input type="text" th:field="*{taxId}" class="form-control text-uppercase" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{taxId}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="yearsInOperation">Years in operation</label>
                            <input type="number" min="0" max="200" th:field="*{yearsInOperation}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{yearsInOperation}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="email">Company email</label>
                            <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="websiteUrl">Website</label>
                            <input type="url" th:field="*{websiteUrl}" class="form-control" th:errorclass="is-invalid" placeholder="https://">
                            <div class="invalid-feedback" th:errors="*{websiteUrl}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="description">About your facility</label>
                            <textarea th:field="*{description}" rows="4" class="form-control" th:errorclass="is-invalid"></textarea>
                            <div class="invalid-feedback" th:errors="*{description}"></div>
                        </div>
                    </div>

                    <div class="form-section-title">Capabilities</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Processes</label>
                            <div class="check-grid">
                                <div class="form-check" th:each="p : ${processes}">
                                    <input class="form-check-input" type="checkbox" th:field="*{processIds}" th:value="${p.id}">
                                    <label class="form-check-label" th:for="${#ids.prev('processIds')}" th:text="${p.processName}">CNC</label>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Materials</label>
                            <div class="check-grid">
                                <div class="form-check" th:each="mat : ${materials}">
                                    <input class="form-check-input" type="checkbox" th:field="*{materialIds}" th:value="${mat.id}">
                                    <label class="form-check-label" th:for="${#ids.prev('materialIds')}" th:text="${mat.materialName}">Steel</label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section-title">Address</div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input type="text" th:field="*{addressLine1}" class="form-control" placeholder="Address line 1">
                        </div>
                        <div class="col-md-6">
                            <input type="text" th:field="*{addressLine2}" class="form-control" placeholder="Address line 2 (optional)">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="city">City</label>
                            <input type="text" th:field="*{city}" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="state">State</label>
                            <input type="text" th:field="*{state}" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="postalCode">PIN code</label>
                            <input type="text" th:field="*{postalCode}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{postalCode}"></div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label" for="country">Country</label>
                            <input type="text" th:field="*{country}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{country}"></div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-forge px-4 mt-4">Save company</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
