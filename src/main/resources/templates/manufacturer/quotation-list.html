<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Quotations · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 class="page-title">Your quotations</h1>
            <p class="page-subtitle">Every version you have sent, newest first.</p>
        </div>
        <a class="btn btn-forge" th:href="@{/manufacturer/rfqs}"><i class="bi bi-inbox me-1"></i> RFQ inbox</a>
    </div>

    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead>
                <tr><th>Quotation</th><th>RFQ</th><th class="text-end">Total</th><th>Lead time</th><th>Valid until</th><th>Status</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="q : ${page.content}">
                    <td><span th:text="${q.quotationNumber}">QTN</span> <small th:text="${'v' + q.versionNumber}">v1</small></td>
                    <td>
                        <a th:href="@{/manufacturer/rfqs/{id}(id=${q.rfqId})}" th:text="${q.rfqTitle}">RFQ</a><br>
                        <small th:text="${q.rfqNumber}">RFQ-...</small>
                    </td>
                    <td class="text-end" th:text="${@fmt.money(q.totalAmount, q.currency)}">₹0</td>
                    <td th:text="${q.leadTimeDays + ' days'}">14 days</td>
                    <td>
                        <span th:text="${@fmt.date(q.validUntil)}">date</span>
                        <small class="text-danger d-block" th:if="${q.expired and q.status.name() == 'SUBMITTED'}">Expired</small>
                    </td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${q.status})}"></span></td>
                    <td class="text-end">
                        <form th:if="${q.status.name() == 'SUBMITTED'}" th:action="@{/manufacturer/quotations/{id}/withdraw(id=${q.quotationId})}"
                              method="post" data-confirm="Withdraw this quotation? The buyer will be informed.">
                            <button type="submit" class="btn btn-sm btn-ghost text-danger">Withdraw</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-cash-stack', 'No quotations yet', 'Open your RFQ inbox to quote on matching requests.', '/manufacturer/rfqs', 'Open RFQ inbox')}"></div></th:block>
    </div>

    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/manufacturer/quotations')}"></nav>
</div>
</body>
</html>
