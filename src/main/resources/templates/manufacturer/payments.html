<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Payments · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header"><div><h1 class="page-title">Payments received</h1>
        <p class="page-subtitle">Orders are ready to ship once the buyer's payment shows as Paid.</p></div></div>
    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead><tr><th>Reference</th><th>Order</th><th>Buyer</th><th>Method</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="p : ${page.content}">
                    <td th:text="${p.reference}">PAY</td>
                    <td><a th:href="@{/manufacturer/orders/{id}(id=${p.orderId})}" th:text="${p.orderNumber}">ORD</a></td>
                    <td th:text="${p.buyerName}">Buyer</td>
                    <td th:text="${p.method.label}">Card</td>
                    <td th:text="${@fmt.money(p.amount, p.currency)}">₹</td>
                    <td th:text="${@fmt.dateTime(p.createdAt)}">date</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${p.status})}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-cash-coin', 'No payments yet', 'Payments appear here when buyers pay for orders.', null, null)}"></div></th:block>
    </div>
    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/manufacturer/payments')}"></nav>
</div>
</body>
</html>
