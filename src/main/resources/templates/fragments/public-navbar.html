<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="navbar" class="public-nav sticky-top">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="brand navbar-brand" th:href="@{/}"><span class="brand-mark">FT</span> ForgeTrace</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#publicNav"
                    aria-controls="publicNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="publicNav">
                <ul class="navbar-nav mx-auto gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/manufacturers}"
                           th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/manufacturers')} ? 'active'">Manufacturers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/how-it-works}"
                           th:classappend="${currentPath == '/how-it-works'} ? 'active'">How it works</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/about}"
                           th:classappend="${currentPath == '/about'} ? 'active'">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/contact}"
                           th:classappend="${currentPath == '/contact'} ? 'active'">Contact</a>
                    </li>
                </ul>
                <div class="d-flex gap-2 mt-3 mt-lg-0">
                    <th:block th:if="${currentUser == null}">
                        <a class="btn btn-ghost" th:href="@{/auth/login}">Sign in</a>
                        <a class="btn btn-forge" th:href="@{/auth/register}">Get started</a>
                    </th:block>
                    <th:block th:if="${currentUser != null}">
                        <a class="btn btn-forge" th:href="@{${dashboardUrl}}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                        <form th:action="@{/auth/logout}" method="post" class="m-0">
                            <button type="submit" class="btn btn-ghost">Sign out</button>
                        </form>
                    </th:block>
                </div>
            </div>
        </div>
    </nav>
</header>
</html>
