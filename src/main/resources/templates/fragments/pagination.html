<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Usage with a Spring Data Page:
  <nav th:replace="~{fragments/pagination :: pagination(${page}, '/buyer/rfqs')}"></nav>
-->
<nav th:fragment="pagination(page, baseUrl)" th:if="${page != null and page.totalPages > 1}" aria-label="Pages" class="mt-3">
    <ul class="pagination pagination-sm justify-content-end mb-0">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.number - 1})}" aria-label="Previous">‹</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{${baseUrl}(page=${i})}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.number + 1})}" aria-label="Next">›</a>
        </li>
    </ul>
</nav>
</html>
