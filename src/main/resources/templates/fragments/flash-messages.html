<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Shows one-time messages added with redirectAttributes.addFlashAttribute("success" / "error" / "info", ...) -->
<div th:fragment="flash">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show alert-autohide" role="alert">
        <i class="bi bi-check-circle me-2"></i><span th:text="${success}">Saved.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}">Error.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${info}" class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="bi bi-info-circle me-2"></i><span th:text="${info}">Info.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
</html>
