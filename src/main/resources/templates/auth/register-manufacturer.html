<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manufacturer registration · ForgeTrace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-card wide">
        <a class="brand" th:href="@{/}"><span class="brand-mark">FT</span> ForgeTrace</a>
        <h1 class="auth-title">Manufacturer registration</h1>
        <p class="auth-subtitle">Your company will be reviewed by an admin before buyers can see it.</p>

        <form th:action="@{/auth/register/manufacturer}" th:object="${form}" method="post" novalidate>
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</p>
            </div>

            <div class="form-section-title">Your details</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="fullName">Full name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" th:errorclass="is-invalid" autocomplete="name">
                    <div class="invalid-feedback" th:errors="*{fullName}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="email">Work email</label>
                    <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" autocomplete="email">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="phone">Phone <span class="text-muted-ft">(optional)</span></label>
                    <input type="tel" th:field="*{phone}" class="form-control" th:errorclass="is-invalid" autocomplete="tel">
                    <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>
            </div>

            <div class="form-section-title">Company</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="companyName">Company name</label>
                    <input type="text" th:field="*{companyName}" class="form-control" th:errorclass="is-invalid" autocomplete="organization">
                    <div class="invalid-feedback" th:errors="*{companyName}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="city">City</label>
                    <input type="text" th:field="*{city}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{city}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="state">State</label>
                    <input type="text" th:field="*{state}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{state}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="registrationNumber">Registration no. <span class="text-muted-ft">(optional)</span></label>
                    <input type="text" th:field="*{registrationNumber}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{registrationNumber}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="taxId">GSTIN <span class="text-muted-ft">(optional)</span></label>
                    <input type="text" th:field="*{taxId}" class="form-control text-uppercase" th:errorclass="is-invalid" placeholder="27ABCDE1234F1Z5">
                    <div class="invalid-feedback" th:errors="*{taxId}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="yearsInOperation">Years in operation</label>
                    <input type="number" min="0" max="200" th:field="*{yearsInOperation}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{yearsInOperation}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="description">About your facility <span class="text-muted-ft">(optional)</span></label>
                    <textarea th:field="*{description}" rows="3" class="form-control" th:errorclass="is-invalid"
                              placeholder="Machines, certifications, typical part sizes, industries served..."></textarea>
                    <div class="invalid-feedback" th:errors="*{description}"></div>
                </div>
            </div>

            <div class="form-section-title">Capabilities</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Processes you offer</label>
                    <div class="check-grid" th:classappend="${#fields.hasErrors('processIds')} ? 'has-error'">
                        <div class="form-check" th:each="p : ${processes}">
                            <input class="form-check-input" type="checkbox" th:field="*{processIds}" th:value="${p.id}">
                            <label class="form-check-label" th:for="${#ids.prev('processIds')}" th:text="${p.processName}">CNC Machining</label>
                        </div>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('processIds')}" th:errors="*{processIds}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Materials you work with</label>
                    <div class="check-grid" th:classappend="${#fields.hasErrors('materialIds')} ? 'has-error'">
                        <div class="form-check" th:each="m : ${materials}">
                            <input class="form-check-input" type="checkbox" th:field="*{materialIds}" th:value="${m.id}">
                            <label class="form-check-label" th:for="${#ids.prev('materialIds')}" th:text="${m.materialName}">Mild Steel</label>
                        </div>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('materialIds')}" th:errors="*{materialIds}"></div>
                </div>
            </div>

            <div class="form-section-title">Password</div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid" autocomplete="new-password">
                    <div class="invalid-feedback" th:errors="*{password}"></div>
                    <div class="form-text text-muted-ft">At least 8 characters, with a letter and a number.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="confirmPassword">Confirm password</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control" th:errorclass="is-invalid" autocomplete="new-password">
                    <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                </div>
            </div>

            <div class="form-check mt-4">
                <input type="checkbox" th:field="*{acceptTerms}" class="form-check-input" th:errorclass="is-invalid">
                <label class="form-check-label" th:for="${#ids.prev('acceptTerms')}">
                    I agree to the <a th:href="@{/terms}" target="_blank">Terms</a> and
                    <a th:href="@{/privacy}" target="_blank">Privacy Notice</a>.
                </label>
                <div class="invalid-feedback" th:errors="*{acceptTerms}"></div>
            </div>

            <button type="submit" class="btn btn-forge w-100 py-2 mt-4">Create manufacturer account</button>
        </form>

        <p class="auth-footer">
            <a th:href="@{/auth/register}">← Back</a> · Already registered? <a th:href="@{/auth/login}">Sign in</a>
        </p>
    </section>
</main>
</body>
</html>
