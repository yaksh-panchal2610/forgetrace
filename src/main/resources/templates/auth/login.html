<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · ForgeTrace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-card">
        <a class="brand" th:href="@{/}"><span class="brand-mark">FT</span> ForgeTrace</a>
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-subtitle">Manufacturing marketplace &amp; traceability</p>

        <div th:if="${param.error}" class="alert alert-danger">
            Invalid email or password, or the account is not active.
        </div>
        <div th:if="${param.logout}" class="alert alert-info">You have been signed out.</div>
        <div th:if="${param.reset}" class="alert alert-success">Password updated. Sign in with your new password.</div>
        <div th:if="${param.registered}" class="alert alert-success"
             th:text="${param.registered[0] == 'manufacturer'}
                      ? 'Manufacturer account created. You can sign in now. Your company will appear to buyers after an admin verifies it.'
                      : 'Account created. You can sign in now.'">Account created.</div>

        <form th:action="@{/auth/login}" method="post" class="vstack gap-3">
            <div>
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control"
                       required autofocus autocomplete="username">
            </div>
            <div>
                <div class="d-flex justify-content-between">
                    <label for="password" class="form-label">Password</label>
                    <a th:href="@{/auth/forgot-password}" class="small">Forgot password?</a>
                </div>
                <input type="password" id="password" name="password" class="form-control"
                       required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-forge w-100 py-2">Sign in</button>
        </form>

        <p class="auth-footer">New to ForgeTrace? <a th:href="@{/auth/register}">Create an account</a></p>
    </section>
</main>
</body>
</html>
