<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose a new password · ForgeTrace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-card">
        <a class="brand" th:href="@{/}"><span class="brand-mark">FT</span> ForgeTrace</a>
        <h1 class="auth-title">Choose a new password</h1>

        <div th:unless="${tokenValid}">
            <div class="alert alert-danger mt-3">This reset link is invalid or has expired.</div>
            <a class="btn btn-forge w-100 py-2" th:href="@{/auth/forgot-password}">Request a new link</a>
        </div>

        <form th:if="${tokenValid}" th:action="@{/auth/reset-password}" th:object="${form}" method="post"
              class="vstack gap-3 mt-3" novalidate>
            <input type="hidden" th:field="*{token}">
            <div>
                <label class="form-label" for="password">New password</label>
                <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid" autocomplete="new-password">
                <div class="invalid-feedback" th:errors="*{password}"></div>
                <div class="form-text text-muted-ft">At least 8 characters, with a letter and a number.</div>
            </div>
            <div>
                <label class="form-label" for="confirmPassword">Confirm new password</label>
                <input type="password" th:field="*{confirmPassword}" class="form-control" th:errorclass="is-invalid" autocomplete="new-password">
                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
            </div>
            <button type="submit" class="btn btn-forge w-100 py-2">Update password</button>
        </form>

        <p class="auth-footer"><a th:href="@{/auth/login}">← Back to sign in</a></p>
    </section>
</main>
</body>
</html>
