<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password · ForgeTrace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="auth-body">
<main class="auth-shell">
    <section class="auth-card">
        <a class="brand" th:href="@{/}"><span class="brand-mark">FT</span> ForgeTrace</a>
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Enter your account email and we'll send you a reset link.</p>

        <div th:if="${param.sent}" class="alert alert-success">
            If an account exists for that email, a reset link has been sent. The link is valid for 30 minutes.
        </div>

        <form th:action="@{/auth/forgot-password}" th:object="${form}" method="post" class="vstack gap-3" novalidate>
            <div>
                <label class="form-label" for="email">Email</label>
                <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" autocomplete="email" autofocus>
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <button type="submit" class="btn btn-forge w-100 py-2">Send reset link</button>
        </form>

        <p class="auth-footer"><a th:href="@{/auth/login}">← Back to sign in</a></p>
    </section>
</main>
</body>
</html>
