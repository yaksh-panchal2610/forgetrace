<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Batches · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header"><div><h1 class="page-title">All batches</h1>
        <p class="page-subtitle">Approved and shipped batches can be recalled.</p></div></div>
    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead><tr><th>Batch</th><th>Order</th><th>Manufacturer</th><th>Buyer</th><th>Quantity</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="b : ${page.content}">
                    <td th:text="${b.batchNumber}">BAT</td>
                    <td th:text="${b.orderNumber}">ORD</td>
                    <td th:text="${b.manufacturerName}">m</td>
                    <td th:text="${b.buyerName}">b</td>
                    <td th:text="${b.quantity.stripTrailingZeros().toPlainString() + ' ' + b.quantityUnit}">50</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${b.status})}"></span></td>
                    <td class="text-end text-nowrap">
                        <a th:if="${b.hasPassport}" class="btn btn-sm btn-ghost" th:href="@{/p/{t}(t=${b.passportToken})}" target="_blank"><i class="bi bi-qr-code"></i></a>
                        <a th:if="${b.status.name() == 'APPROVED' or b.status.name() == 'SHIPPED'}" class="btn btn-sm btn-ghost"
                           th:href="@{/admin/recalls/new(batchId=${b.id})}"><i class="bi bi-exclamation-octagon"></i> Recall</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-stack', 'No batches yet', 'Production batches appear here.', null, null)}"></div></th:block>
    </div>
    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/admin/batches')}"></nav>
</div>
</body>
</html>
