<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>RFQs · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header"><div><h1 class="page-title">All RFQs</h1></div></div>
    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead><tr><th>RFQ</th><th>Buyer</th><th>Process / material</th><th>Created</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="r : ${page.content}">
                    <td><strong th:text="${r.rfqNumber}">RFQ</strong><br><small th:text="${r.title}">t</small></td>
                    <td th:text="${r.buyerName}">b</td>
                    <td th:text="${r.processName + ' · ' + r.materialName}">p</td>
                    <td th:text="${@fmt.dateTime(r.createdAt)}">d</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${r.status})}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-file-earmark-text', 'No RFQs yet', 'Buyer RFQs appear here.', null, null)}"></div></th:block>
    </div>
    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/admin/rfqs')}"></nav>
</div>
</body>
</html>
