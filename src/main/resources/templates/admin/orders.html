<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Orders · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header"><div><h1 class="page-title">All orders</h1></div></div>
    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead><tr><th>Order</th><th>Buyer</th><th>Manufacturer</th><th>Amount</th><th>Created</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="o : ${page.content}">
                    <td><strong th:text="${o.orderNumber}">ORD</strong><br><small th:text="${o.itemTitle}">t</small></td>
                    <td th:text="${o.buyerName}">b</td>
                    <td th:text="${o.manufacturerName}">m</td>
                    <td th:text="${@fmt.money(o.totalAmount, o.currency)}">₹</td>
                    <td th:text="${@fmt.dateTime(o.createdAt)}">d</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${o.status})}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-box-seam', 'No orders yet', 'Orders appear here when buyers accept quotations.', null, null)}"></div></th:block>
    </div>
    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/admin/orders')}"></nav>
</div>
</body>
</html>
