<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Disputes · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header"><div><h1 class="page-title">Disputes</h1></div></div>
    <div class="d-flex flex-wrap gap-2 mb-3">
        <a class="btn btn-sm" th:classappend="${status == null} ? 'btn-forge' : 'btn-ghost'" th:href="@{/admin/disputes}">All</a>
        <a th:each="s : ${statuses}" class="btn btn-sm" th:classappend="${status == s} ? 'btn-forge' : 'btn-ghost'"
           th:href="@{/admin/disputes(status=${s})}" th:text="${s.label}">Open</a>
    </div>
    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead><tr><th>Order</th><th>Buyer → Manufacturer</th><th>Reason</th><th>Opened</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="d : ${page.content}">
                    <td th:text="${d.orderNumber}">ORD</td>
                    <td th:text="${d.buyerName + ' → ' + d.manufacturerName}">b</td>
                    <td th:text="${d.reason}">r</td>
                    <td th:text="${@fmt.dateTime(d.createdAt)}">d</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${d.status})}"></span></td>
                    <td class="text-end"><a class="btn btn-sm btn-ghost" th:href="@{/admin/disputes/{id}(id=${d.id})}">Open</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-flag', 'No disputes', 'Disputes opened by buyers appear here.', null, null)}"></div></th:block>
    </div>
    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/admin/disputes')}"></nav>
</div>
</body>
</html>
