<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Recalls · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div><h1 class="page-title">Recalls</h1><p class="page-subtitle">Start a recall from the Batches page.</p></div>
        <a class="btn btn-forge" th:href="@{/admin/batches}"><i class="bi bi-plus-lg me-1"></i> New recall</a>
    </div>
    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead><tr><th>Batch</th><th>Manufacturer</th><th>Severity</th><th>Acknowledged</th><th>Issued</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="r : ${page.content}">
                    <td><strong th:text="${r.batchNumber}">BAT</strong><br><small th:text="${r.orderNumber}">ORD</small></td>
                    <td th:text="${r.manufacturerName}">m</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${r.severity})}"></span></td>
                    <td th:text="${(#lists.size(r.recipients) - r.pendingCount) + ' / ' + #lists.size(r.recipients)}">0/1</td>
                    <td th:text="${@fmt.dateTime(r.createdAt)}">d</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${r.status})}"></span></td>
                    <td class="text-end"><a class="btn btn-sm btn-ghost" th:href="@{/admin/recalls/{id}(id=${r.id})}">Open</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-exclamation-octagon', 'No recalls', 'Recalls you issue appear here.', '/admin/batches', 'Open batches')}"></div></th:block>
    </div>
    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/admin/recalls')}"></nav>
</div>
</body>
</html>
