<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Machines · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header"><div><h1 class="page-title">All machines</h1></div></div>
    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead><tr><th>Machine</th><th>Type</th><th>Manufacturer</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="m : ${page.content}">
                    <td th:text="${m.machineName}">n</td>
                    <td th:text="${m.machineType}">t</td>
                    <td th:text="${m.organizationName}">o</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${m.status})}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-gear-wide-connected', 'No machines yet', 'Manufacturer machines appear here.', null, null)}"></div></th:block>
    </div>
    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/admin/machines')}"></nav>
</div>
</body>
</html>
