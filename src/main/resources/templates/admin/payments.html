<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Payments · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header"><div><h1 class="page-title">All payments</h1></div></div>
    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead><tr><th>Reference</th><th>Order</th><th>Buyer → Manufacturer</th><th>Method</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="p : ${page.content}">
                    <td><span th:text="${p.reference}">PAY</span><br><small class="text-muted-ft" th:text="${p.providerReference} ?: ''">sbx</small></td>
                    <td th:text="${p.orderNumber}">ORD</td>
                    <td th:text="${p.buyerName + ' → ' + p.manufacturerName}">b</td>
                    <td th:text="${p.method.label}">Card</td>
                    <td th:text="${@fmt.money(p.amount, p.currency)}">₹</td>
                    <td th:text="${@fmt.dateTime(p.createdAt)}">d</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${p.status})}"></span>
                        <small class="d-block measure-fail" th:if="${p.failureReason != null}" th:text="${p.failureReason}">r</small></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-credit-card', 'No payments yet', 'Payments appear here.', null, null)}"></div></th:block>
    </div>
    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/admin/payments')}"></nav>
</div>
</body>
</html>
