<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Inspection history · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header"><div><h1 class="page-title">My inspections</h1></div></div>
    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead><tr><th>Date</th><th>Batch</th><th>Type</th><th>Measurements</th><th>Result</th><th></th></tr></thead>
                <tbody>
                <tr th:each="i : ${page.content}">
                    <td th:text="${@fmt.dateTime(i.inspectedAt)}">date</td>
                    <td th:text="${i.batchNumber}">BAT</td>
                    <td th:text="${i.type.label}">Final</td>
                    <td th:text="${#lists.size(i.measurements)}">3</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${i.status})}"></span></td>
                    <td class="text-end"><a class="btn btn-sm btn-ghost" th:href="@{/inspector/inspections/{id}(id=${i.id})}">View</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-clock-history', 'No inspections yet', 'Your recorded inspections appear here.', '/inspector/queue', 'Open queue')}"></div></th:block>
    </div>
    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/inspector/history')}"></nav>
</div>
</body>
</html>
