<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/app :: layout(~{::title}, ~{::content})}">
<head><title>Orders · ForgeTrace</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 class="page-title">Orders</h1>
            <p class="page-subtitle">Production orders created from the quotations you accepted.</p>
        </div>
    </div>

    <div class="ft-card">
        <div class="table-responsive" th:if="${!page.isEmpty()}">
            <table class="table table-ft table-hover">
                <thead>
                <tr><th>Order</th><th>Item</th><th>Manufacturer</th><th class="text-end">Total</th><th>Expected</th><th>Status</th></tr>
                </thead>
                <tbody>
                <tr th:each="o : ${page.content}">
                    <td>
                        <a th:href="@{/buyer/orders/{id}(id=${o.id})}" th:text="${o.orderNumber}">ORD</a><br>
                        <small th:text="${@fmt.date(o.createdAt)}">date</small>
                    </td>
                    <td>
                        <span th:text="${o.rfqTitle}">Title</span><br>
                        <small th:text="${o.quantity.stripTrailingZeros().toPlainString() + ' ' + o.quantityUnit + ' · ' + o.processName}">100 pcs</small>
                    </td>
                    <td th:text="${o.manufacturerName}">Manufacturer</td>
                    <td class="text-end fw-semibold" th:text="${@fmt.money(o.totalAmount, o.currency)}">₹0</td>
                    <td th:text="${@fmt.localDate(o.expectedCompletion)}">date</td>
                    <td><span th:replace="~{fragments/status-badge :: badge(${o.status})}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:if="${page.isEmpty()}"><div th:replace="~{fragments/empty-state :: empty('bi-box-seam', 'No orders yet', 'Accept a quotation on one of your RFQs to create an order.', '/buyer/rfqs', 'View my RFQs')}"></div></th:block>
    </div>

    <nav th:replace="~{fragments/pagination :: pagination(${page}, '/buyer/orders')}"></nav>
</div>
</body>
</html>
