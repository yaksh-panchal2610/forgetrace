# ===== Local development (your laptop) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/forgetrace}
spring.datasource.username=${DB_USERNAME:forgetrace}
spring.datasource.password=${DB_PASSWORD:forgetrace_dev}

# See HTML changes without restarting
spring.thymeleaf.cache=false

# Show SQL in the console while developing
spring.jpa.show-sql=true
logging.level.com.forgetrace=DEBUG

# Files are saved in a local "uploads" folder
app.storage.mode=local
app.storage.local-dir=uploads


# ===== Step 3: login & seeded accounts (DEVELOPMENT ONLY) =====
app.base-url=http://localhost:8080
# Prints password-reset links in the console (no email server yet)
app.mail.log-links=true

app.admin.name=Platform Admin
app.admin.email=${ADMIN_EMAIL:admin@forgetrace.local}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

app.inspector.name=Quality Inspector
app.inspector.email=${INSPECTOR_EMAIL:inspector@forgetrace.local}
app.inspector.password=${INSPECTOR_PASSWORD:Inspector@12345}
app.mail.log-emails=true